<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anime Scraper NG</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div class="mx-auto max-w-6xl px-4 py-8">
      <header class="mb-6">
        <h1 class="text-3xl font-bold">Anime Scraper NG</h1>
      </header>

      <input
        id="search"
        type="search"
        placeholder="Search animes..."
        autocomplete="off"
        class="mb-6 w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none"
      />

      <p id="total" class="mb-4 text-sm text-slate-400"></p>

      <div
        id="grid"
        class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5"
      ></div>

      <p id="status" class="py-8 text-center text-sm text-slate-400"></p>

      <!-- the sentinel: scrolling this into view triggers the next page -->
      <div id="load-more-trigger" class="h-1"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
